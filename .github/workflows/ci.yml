name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build client
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run client tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload client coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage/client/coverage-final.json
          flags: client
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-server:
    name: Server Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run server tests with coverage
        run: npm run test:server:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret-for-ci
          SESSION_SECRET: test-session-secret-for-ci

      - name: Upload server coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage/server/coverage-final.json
          flags: server
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Build server
        run: npm run build:server

      - name: Start server in background
        run: node dist-server/index.cjs &
        env:
          NODE_ENV: test
          PORT: 3065
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}

      - name: Wait for server
        run: npx wait-on http://localhost:3065/api/health --timeout 30000 || true

      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3065
          NODE_ENV: test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  bundle-size:
    name: Bundle Size Report
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Report bundle size
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          for f in $(find dist -name '*.js' -o -name '*.css' | sort); do
            SIZE=$(wc -c < "$f" | xargs)
            GZIP=$(gzip -c "$f" | wc -c | xargs)
            SIZE_KB=$(echo "scale=1; $SIZE/1024" | bc)
            GZIP_KB=$(echo "scale=1; $GZIP/1024" | bc)
            echo "| $(basename $f) | ${SIZE_KB}KB | ${GZIP_KB}KB |" >> $GITHUB_STEP_SUMMARY
          done
          TOTAL=$(find dist -name '*.js' -exec cat {} + | wc -c | xargs)
          TOTAL_KB=$(echo "scale=1; $TOTAL/1024" | bc)
          TOTAL_GZIP=$(find dist -name '*.js' -exec cat {} + | gzip -c | wc -c | xargs)
          TOTAL_GZIP_KB=$(echo "scale=1; $TOTAL_GZIP/1024" | bc)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total JS: ${TOTAL_KB}KB (gzipped: ${TOTAL_GZIP_KB}KB)**" >> $GITHUB_STEP_SUMMARY

          # ── Bundle size threshold (fail if gzipped JS exceeds 500KB) ──
          MAX_GZIP_KB=500
          if [ "$(echo "$TOTAL_GZIP_KB > $MAX_GZIP_KB" | bc)" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Bundle too large!** Gzipped JS (${TOTAL_GZIP_KB}KB) exceeds ${MAX_GZIP_KB}KB limit." >> $GITHUB_STEP_SUMMARY
            echo "::error::Bundle size ${TOTAL_GZIP_KB}KB exceeds ${MAX_GZIP_KB}KB gzipped limit"
            exit 1
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Bundle is within the ${MAX_GZIP_KB}KB gzipped limit." >> $GITHUB_STEP_SUMMARY

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for HIGH and CRITICAL vulnerabilities..."
          npm audit --json > audit.json || true
          CRITICAL=$(cat audit.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit.json | jq '.metadata.vulnerabilities.high // 0')
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt "0" ] || [ "$HIGH" -gt "0" ]; then
            echo "❌ Found $CRITICAL critical and $HIGH high severity vulnerabilities!"
            npm audit
            exit 1
          fi
          echo "✅ No critical or high vulnerabilities found"

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
