name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: https://7care-app.vercel.app
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '7Care v__VERSION__'
          releaseBody: |
            ## 7Care - Sistema de Gestao para Igrejas

            Baixe o instalador para seu sistema operacional:
            - **Windows**: arquivo `.exe`
            - **macOS (Apple Silicon)**: arquivo `.dmg` (aarch64)
            - **macOS (Intel)**: arquivo `.dmg` (x64)
            - **Linux**: arquivo `.AppImage` ou `.deb`

            ### iPhone / iPad
            Use a versao web (PWA): abra https://7care-app.vercel.app no Safari e toque em "Adicionar a Tela de Inicio".
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
